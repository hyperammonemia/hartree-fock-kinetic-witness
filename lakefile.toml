name = "hartree-fock-kinetic-witness"
version = "0.1.0"
defaultTargets = ["HFNotes", "ContinuumResults"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "fc4f59e577feb1a4956671bc04ac18aaaf8cd842"

[[lean_lib]]
name = "HFNotes"
roots = ["HFNotes", "RadialCertificate", "ContinuumForms", "FinitePotential", "KineticAmplification", "FiniteOscillatoryWindow"]

[[lean_lib]]
name = "ContinuumResults"
srcDir = "continuum"
roots = ["ContinuumResults", "ContinuumHamiltonian", "FiniteKinetic", "GaussianCoulomb", "RadialBarrier", "RadialConfiguration", "RadialProbe", "UnitVariational", "WeakRadial", "WeightNormalization"]
