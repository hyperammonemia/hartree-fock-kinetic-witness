name = "hartree-fock-kinetic-witness"
version = "0.1.0"
defaultTargets = ["HFNotes", "ContinuumResults"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "fc4f59e577feb1a4956671bc04ac18aaaf8cd842"

[[lean_lib]]
name = "HFNotes"
roots = ["HFNotes", "RadialCertificate", "ContinuumForms", "FinitePotential", "KineticAmplification", "FiniteOscillatoryWindow"]

[[lean_lib]]
name = "RayleighReweighting"
srcDir = "supplement"

[[lean_lib]]
name = "ContinuumResults"
srcDir = "continuum"
roots = ["ContinuumResults", "ClosedGraphDomain", "ContinuumHamiltonian", "CoordinateSlater", "CoulombBounds", "CoulombCentering", "CutoffDerivative", "ExteriorTail", "FiberKato", "FiniteKinetic", "FixedKinetic", "FixedRadialDomain", "FixedRadialSectionFive", "FluxHats", "FluxTests", "FormAttainment", "FourthTrial", "GaussianCore", "GaussianCoulomb", "GaussianRadialMoments", "GaussianTensor", "GroundMinimum", "GroundSymmetry", "HardyRay", "KineticDilation", "KineticStates", "MarginalProbe", "ModulatedWeak", "NewtonGaussian", "NewtonPerturbation", "PhysicalGradient", "ProbeStability", "PullbackIntegrals", "RadialBarrier", "RadialConfiguration", "RadialDifferential", "RadialProbe", "SectionFive", "SingletKinetic", "SlaterConclusion", "SlaterEnergy", "SlaterFormDomain", "SlaterGeometry", "SlaterOccupation", "StateKineticOrder", "UnitVariational", "WeakGradient", "WeakProduct", "WeakRadial", "WeightNormalization", "WeightedGap"]
